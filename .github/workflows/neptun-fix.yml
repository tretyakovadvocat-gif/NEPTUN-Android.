name: NEPTUN FIX - Android APK

on:
  push:
    paths:
      - '.github/workflows/neptun-fix.yml'
      - 'NEPTUN_Official_Build_Project.zip'
      - 'NEPTUN_Official_Build_Project_V2.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Get game files
        uses: actions/checkout@v4

      - name: Unpack available NEPTUN game
        shell: bash
        run: |
          set -euo pipefail
          if [ -f NEPTUN_Official_Build_Project_V2.zip ]; then
            archive=NEPTUN_Official_Build_Project_V2.zip
          elif [ -f NEPTUN_Official_Build_Project.zip ]; then
            archive=NEPTUN_Official_Build_Project.zip
          else
            echo 'ERROR: NEPTUN game ZIP not found in repository root.' >&2
            exit 1
          fi
          echo "Using $archive"
          mkdir -p project
          unzip -q "$archive" -d project
          test -f project/settings.gradle
          test -f project/app/build.gradle
          test -f project/app/src/main/assets/index.html

      - name: Prepare Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use Android SDK already available on GitHub
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK is not configured}"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > project/local.properties

      - name: Prepare Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Compile NEPTUN APK
        working-directory: project
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Make APK available for download
        uses: actions/upload-artifact@v4
        with:
          name: NEPTUN-INSTALL-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
